<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="370" viewBox="0 0 1240 370"><rect width="1240" height="370" rx="20" fill="#f3f6fb"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#17334d}.h{font-size:28px;font-weight:bold}.t{font-size:20px;font-weight:bold}.s{font-size:16px}</style><text x="35" y="50" class="h">Choose a reproduction route</text><rect x="35" y="94" width="375" height="205" rx="12" fill="#dce9f2"/><text x="55" y="132" class="t">1 · Verify released metrics</text><text x="55" y="171" class="s">Released source-level predictions</text><text x="55" y="204" class="s">CPU + NumPy / pandas / scikit-learn</text><text x="55" y="237" class="s">No raw videos or checkpoints needed</text><text x="55" y="274" class="s">Recomputes tables, not training</text><rect x="433" y="94" width="375" height="205" rx="12" fill="#c9e7e3"/><text x="453" y="132" class="t">2 · Repeat nested training</text><text x="453" y="171" class="s">Prepared caches + fixed manifests</text><text x="453" y="204" class="s">Pinned sources + CUDA runtime</text><text x="453" y="237" class="s">5 outer folds × 3 seeds per condition</text><text x="453" y="274" class="s">Training-only selection and scaling</text><rect x="831" y="94" width="375" height="205" rx="12" fill="#e1daf1"/><text x="851" y="132" class="t">3 · Replay fitted explanations</text><text x="851" y="171" class="s">Matched inputs + original checkpoints</text><text x="851" y="204" class="s">Exact descriptor SHAP configuration</text><text x="851" y="237" class="s">Verify hashes and analysis lineage</text><text x="851" y="274" class="s">Do not mix archived/corrected series</text><text x="35" y="341" class="s">These routes have different prerequisites. A cloned repository alone does not reproduce fitted-model inference.</text></svg>